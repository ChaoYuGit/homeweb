{% extends "base.html" %}
{% block title %}Stock Reports - Home Server{% endblock %}
{% block content %}
<h1>Stock Reports</h1>

{% for report in reports %}
<div class="card" style="margin-top: 1rem;">
    <h2 style="margin-bottom: 0.75rem;">{{ report.title }}</h2>
    <pre style="font-size: 0.8rem; line-height: 1.3; overflow-x: auto; white-space: pre; color: var(--text);">{{ report.content }}</pre>
</div>
{% endfor %}
{% endblock %}
