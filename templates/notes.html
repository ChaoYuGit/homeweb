{% extends "base.html" %}
{% block title %}Notes - Home Server{% endblock %}
{% block content %}
<h1>Notes</h1>

<button class="btn btn-primary" onclick="document.getElementById('note-form').style.display='block'">New Note</button>

<form id="note-form" method="POST" action="{{ url_for('notes_create') }}" style="display:none" class="note-form">
    <div class="form-group">
        <input type="text" name="title" placeholder="Note title" required>
    </div>
    <div class="form-group">
        <textarea name="content" rows="4" placeholder="Note content..." required></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" onclick="this.closest('form').style.display='none'">Cancel</button>
    </div>
</form>

<div class="notes-grid">
    {% for note in notes %}
    <div class="note-card card">
        <details>
            <summary class="note-summary">
                <span class="note-title">{{ note.title }}</span>
                <small class="note-date">{{ note.updated_at[:10] }}</small>
            </summary>
            <div class="note-content">{{ note.content }}</div>
            <div class="note-actions">
                <button class="btn-small" onclick="editNote({{ note.id }}, '{{ note.title | e }}', '{{ note.content | e }}')">Edit</button>
                <form method="POST" action="{{ url_for('notes_delete', note_id=note.id) }}" style="display:inline" onsubmit="return confirm('Delete this note?')">
                    <button type="submit" class="btn-small btn-danger">Delete</button>
                </form>
            </div>
        </details>
    </div>
    {% endfor %}
</div>

<div id="edit-modal" class="modal" style="display:none">
    <div class="modal-content card">
        <span class="modal-close" onclick="closeEdit()">&times;</span>
        <h2>Edit Note</h2>
        <form method="POST" id="edit-form">
            <div class="form-group">
                <input type="text" name="title" id="edit-title" required>
            </div>
            <div class="form-group">
                <textarea name="content" id="edit-content" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>
</div>

<script>
function editNote(id, title, content) {
    document.getElementById('edit-form').action = '/notes/' + id + '/edit';
    document.getElementById('edit-title').value = title;
    document.getElementById('edit-content').value = content;
    document.getElementById('edit-modal').style.display = 'flex';
}
function closeEdit() {
    document.getElementById('edit-modal').style.display = 'none';
}
</script>
{% endblock %}
